name: travel_explorer
description: A beginner-friendly Flutter travel discovery app for GDGC recruitment.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  cached_network_image: 3.4.1
  cupertino_icons: 1.0.8
  flutter:
    sdk: flutter
  google_fonts: 8.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: 2.4.8
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
    - assets/fonts/
    - assets/branding/
    - assets/onboarding/
